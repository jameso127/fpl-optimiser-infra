name: terraform

# validate -> plan -> apply, as one pipeline.
#   pull request:  validate, then plan (posted as a comment). Nothing is changed.
#   merge to main: validate, plan, then apply, which waits for you to approve the "production"
#                  environment and then applies the exact plan that was shown.
#
# No keys: Google trusts a short-lived GitHub token, and only this repo is accepted. The pull
# request plan uses a read-only account; apply uses the apply account, which only main can use.
# A change that alters nothing in Google skips the apply. Setup: docs/bootstrap.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Applies never overlap and are never cancelled halfway. Pull request runs can be superseded.
concurrency:
  group: terraform-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_VAR_project_id: ${{ vars.PROJECT_ID }}
  TF_VAR_region: ${{ vars.REGION }}
  TF_VAR_github_repository: ${{ vars.BACKEND_REPOSITORY }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  plan:
    needs: validate
    # Pull requests from forks get no token, so only run for branches of this repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # exchange the GitHub token for short-lived Google credentials
      pull-requests: write # to post the plan comment
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    env:
      # Pull requests: read-only account, no lock, no live lookups (a preview from recorded state).
      # Main: the apply account, which takes the lock and refreshes, so the plan is the full one.
      PLAN_FLAGS: ${{ github.event_name == 'pull_request' && '-lock=false -refresh=false' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ github.event_name == 'pull_request' && vars.GCP_PLANNER_SA || vars.GCP_TERRAFORM_SA }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
          terraform_wrapper: false
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: Plan
        id: plan
        run: |
          code=0
          terraform plan -input=false -no-color -detailed-exitcode $PLAN_FLAGS -out=tfplan || code=$?
          if [ "$code" = 1 ]; then exit 1; fi
          if [ "$code" = 2 ]; then echo "changes=true" >> "$GITHUB_OUTPUT"; else echo "changes=false" >> "$GITHUB_OUTPUT"; fi
          terraform show -no-color tfplan > plan.txt
          { echo '## Terraform plan'; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Comment the plan on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';
            let plan = fs.readFileSync('plan.txt', 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated)';
            const body = `${marker}\n### Terraform plan (preview)\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>\n\nA preview from recorded state. The full plan is shown again before any apply.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && steps.plan.outputs.changes == 'true'
        with:
          name: tfplan
          path: tfplan
          retention-days: 1

  apply:
    needs: plan
    if: github.event_name != 'pull_request' && needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    environment: production # waits here until a required reviewer approves
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tfplan
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
          terraform_wrapper: false
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform apply -input=false tfplan
