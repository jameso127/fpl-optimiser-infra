name: apply

# Runs when a change is merged to main. It makes a plan, shows it in the run summary, then waits
# for you to approve the "production" environment. After approval it applies that exact plan,
# not a fresh one. Pull request previews are in plan.yml.
#
# Credentials: Workload Identity Federation, no keys. The apply account can only be used by this
# workflow on refs/heads/main (enforced in Google, see scripts/bootstrap-ci.sh).
#
# Repository variables (none secret): GCP_WIF_PROVIDER, GCP_TERRAFORM_SA, TF_STATE_BUCKET,
# PROJECT_ID, REGION, BACKEND_REPOSITORY, FPL_TEAM_ID, TELEGRAM_CHAT_ID

on:
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "workflows/**"
      - ".github/workflows/apply.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # exchange the GitHub token for short-lived Google credentials

# Never run two applies at once, and never cancel one halfway through.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  TF_VAR_project_id: ${{ vars.PROJECT_ID }}
  TF_VAR_region: ${{ vars.REGION }}
  TF_VAR_github_repository: ${{ vars.BACKEND_REPOSITORY }}
  TF_VAR_fpl_team_id: ${{ vars.FPL_TEAM_ID }}
  TF_VAR_telegram_chat_id: ${{ vars.TELEGRAM_CHAT_ID }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
          terraform_wrapper: false
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: Plan
        id: plan
        run: |
          code=0
          terraform plan -input=false -detailed-exitcode -out=tfplan || code=$?
          if [ "$code" = 1 ]; then exit 1; fi
          if [ "$code" = 2 ]; then echo "changes=true" >> "$GITHUB_OUTPUT"; else echo "changes=false" >> "$GITHUB_OUTPUT"; fi
          {
            echo '## Terraform plan'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.changes == 'true'
        with:
          name: tfplan
          path: tfplan
          retention-days: 1

  apply:
    needs: plan
    if: needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    environment: production # waits here until a required reviewer approves
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tfplan
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
          terraform_wrapper: false
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform apply -input=false tfplan
