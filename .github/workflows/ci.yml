name: ci

on:
  pull_request:
  push:
    branches: [main]

# No cloud credentials and read-only access to the repo: this only checks the Terraform parses.
permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
      - name: Format
        run: terraform fmt -check -recursive
      - name: Init (no backend, no credentials)
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate
