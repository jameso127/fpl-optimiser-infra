# Pipeline: ingest -> predict -> optimise -> notify.
#
# Cloud Scheduler starts this every morning at 10:00 UK time.
#   1. Run ingest in SCHEDULE_ONLY mode. It reads the FPL schedule and writes a small
#      schedule.json saying whether the next deadline is today.
#   2. Not a deadline day: stop.
#   3. Deadline day: run the four jobs in order, ending with the Telegram message.
# The deadline-day rule lives in the backend (ingest/schedule.py, tested); this only reads the result.
#
# Manual run, skipping the deadline check:
#   gcloud workflows run fpl-pipeline --location=<region> --data='{"force": true}'

main:
  params: [args]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - location: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
          - bucket: ${sys.get_env("DATA_BUCKET")}
          - jobs: ${json.decode(sys.get_env("PIPELINE_JOBS"))}
          - force: ${default(map.get(args, "force"), false)}
          - gameweek: "unknown"

    - check_force:
        switch:
          - condition: ${force}
            next: run_jobs

    - check_schedule:
        call: run_job
        args:
          name: fpl-ingest
          project: ${project}
          location: ${location}
          env:
            - name: SCHEDULE_ONLY
              value: "true"

    - read_schedule:
        call: http.get
        args:
          url: ${"https://storage.googleapis.com/storage/v1/b/" + bucket + "/o/schedule.json?alt=media"}
          auth:
            type: OAuth2
        result: stored

    - parse_schedule:
        assign:
          - schedule: ${if(get_type(stored.body) == "map", stored.body, json.decode(stored.body))}
          - gameweek: ${schedule.gameweek}

    - decide:
        switch:
          - condition: ${schedule.deadline_day}
            next: run_jobs
    - not_a_deadline_day:
        return: ${"the next deadline (gameweek " + string(schedule.gameweek) + ") is not today, so nothing was run"}

    - run_jobs:
        for:
          value: job
          in: ${jobs}
          steps:
            - run:
                call: run_job
                args:
                  name: ${job}
                  project: ${project}
                  location: ${location}

    - finished:
        return: ${"ran the pipeline for gameweek " + string(gameweek)}

run_job:
  params: [name, project, location, env: []]
  steps:
    - execute:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + location + "/jobs/" + name}
          body:
            overrides:
              containerOverrides:
                - env: ${env}
