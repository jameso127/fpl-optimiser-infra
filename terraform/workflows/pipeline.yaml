# Pipeline: ingest -> predict -> optimise -> notify.
#
# Cloud Scheduler starts this every morning at 10:00 UK time and it runs all four jobs in order.
# notify decides for itself whether to send: only when the next deadline is today (the rule is
# in the backend, common/schedule.py). On other days the jobs just refresh the data.
#
# Manual run:
#   gcloud workflows run fpl-pipeline --location=<region>
# To send on a day that is not a deadline day, run the notify job with FORCE_NOTIFY=true.

main:
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - location: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
          - jobs: ${json.decode(sys.get_env("PIPELINE_JOBS"))}

    - run_jobs:
        for:
          value: job
          in: ${jobs}
          steps:
            - run:
                call: run_job
                args:
                  name: ${job}
                  project: ${project}
                  location: ${location}

    - finished:
        return: "ran the pipeline; notify sends only on deadline days"

run_job:
  params: [name, project, location]
  steps:
    - execute:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + location + "/jobs/" + name}
