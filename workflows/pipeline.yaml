# Per-gameweek pipeline: ingest -> predict -> optimise -> notify.
#
# Cloud Scheduler starts this daily; it only does real work when the next gameweek deadline is
# within DEADLINE_WINDOW_HOURS, so the daily trigger costs nothing most days. Every job is
# idempotent, so re-running inside the window just refreshes the outputs.
#
# Manual runs:
#   gcloud workflows run fpl-pipeline --location=<region> --data='{"dry_run": true}'
#   gcloud workflows run fpl-pipeline --location=<region> --data='{"force": true}'
#
# `dry_run` runs every job with DRY_RUN=true (fixture data, no email) and skips the deadline
# check, so it doubles as the deployment smoke test.

main:
  params: [args]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - location: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
          - window_hours: ${int(sys.get_env("DEADLINE_WINDOW_HOURS"))}
          - dry_run: ${default(map.get(args, "dry_run"), false)}
          - force: ${default(map.get(args, "force"), false)}
          - hours_until: -1
          - jobs: ${json.decode(sys.get_env("PIPELINE_JOBS"))}

    - skip_deadline_check:
        switch:
          - condition: ${dry_run or force}
            next: run_jobs

    - fetch_gameweeks:
        call: http.get
        args:
          url: https://fantasy.premierleague.com/api/bootstrap-static/
          headers:
            User-Agent: fpl-optimiser-workflow/0.1
          timeout: 60
        result: bootstrap

    - find_next_deadline:
        for:
          value: event
          in: ${bootstrap.body.events}
          steps:
            - is_next:
                switch:
                  - condition: ${default(map.get(event, "is_next"), false)}
                    steps:
                      - set_hours:
                          assign:
                            - hours_until: ${(time.parse(event.deadline_time) - sys.now()) / 3600}
                      - stop_looking:
                          next: break

    - decide:
        switch:
          - condition: ${hours_until > 0 and hours_until <= window_hours}
            next: run_jobs
    - not_yet:
        return: ${"skipped - hours until next deadline " + string(hours_until) + ", window is " + string(window_hours)}

    - run_jobs:
        for:
          value: job
          in: ${jobs}
          steps:
            - run:
                call: googleapis.run.v2.projects.locations.jobs.run
                args:
                  name: ${"projects/" + project + "/locations/" + location + "/jobs/" + job}
                  body:
                    overrides:
                      containerOverrides:
                        - env:
                            - name: DRY_RUN
                              value: ${string(dry_run)}
                result: execution

    - finished:
        return: ${"pipeline finished for " + string(len(jobs)) + " jobs, dry_run=" + string(dry_run)}
