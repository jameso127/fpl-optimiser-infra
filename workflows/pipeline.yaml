# Pipeline: ingest -> predict -> optimise -> notify.
#
# Cloud Scheduler starts this every morning at 07:00 UK time.
#   1. Run ingest. It saves the day's data and writes schedule.json, which says whether the next
#      deadline is today and when to send (10:00, or 2.5 hours before an early deadline).
#   2. Not a deadline day: refresh the predictions and stop.
#   3. Deadline day: sleep until the run time, then run the whole pipeline again so the advice
#      uses the latest injury news, ending with the Telegram message.
# The timing rule lives in the backend (ingest/schedule.py, tested); this only reads the result.
#
# Manual run, skipping the wait and the deadline check:
#   gcloud workflows run fpl-pipeline --location=<region> --data='{"force": true}'

main:
  params: [args]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - location: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
          - bucket: ${sys.get_env("DATA_BUCKET")}
          - jobs: ${json.decode(sys.get_env("PIPELINE_JOBS"))}
          - force: ${default(map.get(args, "force"), false)}

    - ingest_first:
        call: run_job
        args:
          name: fpl-ingest
          project: ${project}
          location: ${location}

    - read_schedule:
        call: http.get
        args:
          url: ${"https://storage.googleapis.com/storage/v1/b/" + bucket + "/o/schedule.json?alt=media"}
          auth:
            type: OAuth2
        result: stored

    - parse_schedule:
        assign:
          - schedule: ${if(get_type(stored.body) == "map", stored.body, json.decode(stored.body))}

    - decide:
        switch:
          - condition: ${force or schedule.deadline_day}
            next: wait_until_run_time
    - not_a_deadline_day:
        call: run_job
        args:
          name: fpl-predict
          project: ${project}
          location: ${location}
    - nothing_to_send:
        return: ${"not a deadline day, so only refreshed the data and predictions"}

    - wait_until_run_time:
        assign:
          - seconds_to_wait: ${if(force, 0, math.max(0, time.parse(schedule.run_at) - sys.now()))}
    - sleep:
        call: sys.sleep
        args:
          seconds: ${seconds_to_wait}

    - run_jobs:
        for:
          value: job
          in: ${jobs}
          steps:
            - run:
                call: run_job
                args:
                  name: ${job}
                  project: ${project}
                  location: ${location}

    - finished:
        return: ${"sent gameweek " + string(schedule.gameweek) + " after waiting " + string(seconds_to_wait) + " seconds"}

run_job:
  params: [name, project, location]
  steps:
    - execute:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + location + "/jobs/" + name}
